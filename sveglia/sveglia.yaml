substitutions:
  device_name: sveglia-esphome
  friendly_name: Sveglia ESPHome

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Sveglia da comodino con ESP32-C3, OLED e buzzer
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(alarm_ringing) = false;
          id(active_alarm_index) = 0;
          id(ring_started_ts) = 0;
          for (int i = 0; i < 5; i++) {
            id(last_trigger_keys)[i] = -1;
          }

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Sveglie-Esphome Fallback Hotspot"
    password: !secret ap_password

captive_portal:

# ---------------------------------------------------------------------------
# Time: SNTP (independent from Home Assistant)
# ---------------------------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Rome"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

# ---------------------------------------------------------------------------
# I2C bus for OLED
# ---------------------------------------------------------------------------
i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true
  frequency: 400kHz

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto Mono"
    id: font_time
    size: 32
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 12

image:
  - file: "mdi:alarm"
    id: icon_sveglia
    resize: 12x12      # Regola la dimensione in base al tuo display
    type: BINARY       # Ottimale per display OLED monocromatici SSD1306


# ---------------------------------------------------------------------------
# Buzzer (passive piezo on GPIO3 via LEDC PWM)
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO10
    id: rtttl_out

rtttl:
  output: rtttl_out

# ---------------------------------------------------------------------------
# Globals
# ---------------------------------------------------------------------------
globals:
  - id: alarm_ringing
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: active_alarm_index
    type: int
    restore_value: no
    initial_value: '0'
  - id: ring_started_ts
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_trigger_keys
    type: int[5]
    restore_value: no
    initial_value: '{-1, -1, -1, -1, -1}'
  - id: lista_giorni
    type: std::vector<std::string>
    restore_value: no
    initial_value: '{"DOM", "LUN", "MAR", "MER", "GIO", "VEN", "SAB"}'


# ---------------------------------------------------------------------------
# Scripts
# ---------------------------------------------------------------------------
script:
  
  - id: start_alarm_sound
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(alarm_ringing);'
          then:
            - rtttl.play: "Brahms:d=4,o=5,b=80:8e,8e,g.,8e,8e,g.,8e,8g,c6,b,8a,8a,g,8d,8e,f,8d,8d,8e,f,8d,8f,b,a,g,8b,c6"

  - id: stop_alarm_script
    mode: restart
    then:
      - lambda: |-
          id(alarm_ringing) = false;
          id(active_alarm_index) = 0;
          id(ring_started_ts) = 0;

# ---------------------------------------------------------------------------
# Physical stop button (GPIO4, active low with pullup)
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: stop_button
    name: "${friendly_name} Pulsante Stop"
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - script.execute: stop_alarm_script

  # - platform: status
  #   id: node_status
  #   internal: true

