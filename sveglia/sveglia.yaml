# ===========================================================================
# DISPLAY (SSD1306 128x64 OLED)
# ===========================================================================
display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SH1106_128X64"
    address: 0x3C
    update_interval: 1s
    lambda: |-
      auto now = id(sntp_time).now();

      // --- ORE ---
      if (now.is_valid()) {
        it.strftime(13, 11, id(font_time), "%H:%M", now);
      } else {
        it.print(13, 11, id(font_time), "--:--");
      }

      // --- HEADER DAY
      if (now.is_valid()) {
        int cur_dow = now.day_of_week;
        it.print(0,0, id(font_small), id(lista_giorni)[cur_dow - 1].c_str());

        int cur_mod = now.hour * 60 + now.minute;  // minute of day

        // Alarm data: {hour_id, minute_id, enabled_id, day_ids[7] (Sun..Sat)}
        // We access each alarm's entities directly
        struct AlarmSlot {
          float hour;
          float minute;
          bool enabled;
          bool days[7];  // index 0=Sun, 1=Mon, ..., 6=Sat
        };

        AlarmSlot alarms[5];

        // Alarm 1
        alarms[0] = {
          id(alarm_1_hour).state, id(alarm_1_minute).state,
          id(alarm_1_enabled).state,
          {id(alarm_1_sun).state, id(alarm_1_mon).state, id(alarm_1_tue).state,
            id(alarm_1_wed).state, id(alarm_1_thu).state, id(alarm_1_fri).state,
            id(alarm_1_sat).state}
        };
        // Alarm 2
        alarms[1] = {
          id(alarm_2_hour).state, id(alarm_2_minute).state,
          id(alarm_2_enabled).state,
          {id(alarm_2_sun).state, id(alarm_2_mon).state, id(alarm_2_tue).state,
            id(alarm_2_wed).state, id(alarm_2_thu).state, id(alarm_2_fri).state,
            id(alarm_2_sat).state}
        };
        // Alarm 3
        alarms[2] = {
          id(alarm_3_hour).state, id(alarm_3_minute).state,
          id(alarm_3_enabled).state,
          {id(alarm_3_sun).state, id(alarm_3_mon).state, id(alarm_3_tue).state,
            id(alarm_3_wed).state, id(alarm_3_thu).state, id(alarm_3_fri).state,
            id(alarm_3_sat).state}
        };
        // Alarm 4
        alarms[3] = {
          id(alarm_4_hour).state, id(alarm_4_minute).state,
          id(alarm_4_enabled).state,
          {id(alarm_4_sun).state, id(alarm_4_mon).state, id(alarm_4_tue).state,
            id(alarm_4_wed).state, id(alarm_4_thu).state, id(alarm_4_fri).state,
            id(alarm_4_sat).state}
        };
        // Alarm 5
        alarms[4] = {
          id(alarm_5_hour).state, id(alarm_5_minute).state,
          id(alarm_5_enabled).state,
          {id(alarm_5_sun).state, id(alarm_5_mon).state, id(alarm_5_tue).state,
            id(alarm_5_wed).state, id(alarm_5_thu).state, id(alarm_5_fri).state,
            id(alarm_5_sat).state}
        };

        bool alarm_soon = false;
        int next_alarm_h = -1;
        int next_alarm_m = -1;
        int best_delta = 12 * 60 + 1;  // > 12 hours

        if (id(master_alarm_enabled).state) {
          for (int i = 0; i < 5; i++) {
            if (!alarms[i].enabled) continue;
            int a_mod = static_cast<int>(alarms[i].hour) * 60 + static_cast<int>(alarms[i].minute);

            // Check today: alarm is later today and enabled for today's DOW
            if (a_mod > cur_mod && alarms[i].days[cur_dow - 1]) {
              int delta = a_mod - cur_mod;
              if (delta <= 720 && delta < best_delta) {
                best_delta = delta;
                alarm_soon = true;
                next_alarm_h = static_cast<int>(alarms[i].hour);
                next_alarm_m = static_cast<int>(alarms[i].minute);
              }
            }

            // Check tomorrow: alarm wraps into next day
            int tomorrow_dow = (cur_dow % 7) + 1;  // 1-based wrapping
            if (alarms[i].days[tomorrow_dow - 1]) {
              int delta = (1440 - cur_mod) + a_mod;
              if (delta <= 720 && delta < best_delta) {
                best_delta = delta;
                alarm_soon = true;
                next_alarm_h = static_cast<int>(alarms[i].hour);
                next_alarm_m = static_cast<int>(alarms[i].minute);
              }
            }
          }
        }

        if (alarm_soon) {
          it.image(113, 0, id(icon_sveglia));
        }
      }
      if (id(alarm_ringing)) {
        it.printf(0, 47, id(font_small), "!! SVEGLIA %d !!", id(active_alarm_index));
      }

# ===========================================================================
# INTERVAL: alarm check logic (runs every second)
# ===========================================================================
interval:
  - interval: 1s
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;

          // --- Auto-stop: ring duration exceeded ---
          if (id(alarm_ringing)) {
            const int duration_seconds = static_cast<int>(id(ring_duration_minutes).state) * 60;
            if (id(ring_started_ts) > 0 &&
                (now.timestamp - id(ring_started_ts)) >= duration_seconds) {
              id(stop_alarm_script).execute();
            }
            return;
          }

          // --- Master off? Do nothing ---
          if (!id(master_alarm_enabled).state) return;

          // --- Build alarm structs ---
          const int current_key = static_cast<int>(now.timestamp / 60);
          int cur_dow = now.day_of_week;  // ESPHome: 1=Sun, 2=Mon, ..., 7=Sat

          struct AlarmCheck {
            int index;
            int hour;
            int minute;
            bool enabled;
            bool days[7];  // 0=Sun, 1=Mon, ..., 6=Sat
          };

          AlarmCheck alarms[5] = {
            {1, static_cast<int>(id(alarm_1_hour).state), static_cast<int>(id(alarm_1_minute).state),
             id(alarm_1_enabled).state,
             {id(alarm_1_sun).state, id(alarm_1_mon).state, id(alarm_1_tue).state,
              id(alarm_1_wed).state, id(alarm_1_thu).state, id(alarm_1_fri).state,
              id(alarm_1_sat).state}},
            {2, static_cast<int>(id(alarm_2_hour).state), static_cast<int>(id(alarm_2_minute).state),
             id(alarm_2_enabled).state,
             {id(alarm_2_sun).state, id(alarm_2_mon).state, id(alarm_2_tue).state,
              id(alarm_2_wed).state, id(alarm_2_thu).state, id(alarm_2_fri).state,
              id(alarm_2_sat).state}},
            {3, static_cast<int>(id(alarm_3_hour).state), static_cast<int>(id(alarm_3_minute).state),
             id(alarm_3_enabled).state,
             {id(alarm_3_sun).state, id(alarm_3_mon).state, id(alarm_3_tue).state,
              id(alarm_3_wed).state, id(alarm_3_thu).state, id(alarm_3_fri).state,
              id(alarm_3_sat).state}},
            {4, static_cast<int>(id(alarm_4_hour).state), static_cast<int>(id(alarm_4_minute).state),
             id(alarm_4_enabled).state,
             {id(alarm_4_sun).state, id(alarm_4_mon).state, id(alarm_4_tue).state,
              id(alarm_4_wed).state, id(alarm_4_thu).state, id(alarm_4_fri).state,
              id(alarm_4_sat).state}},
            {5, static_cast<int>(id(alarm_5_hour).state), static_cast<int>(id(alarm_5_minute).state),
             id(alarm_5_enabled).state,
             {id(alarm_5_sun).state, id(alarm_5_mon).state, id(alarm_5_tue).state,
              id(alarm_5_wed).state, id(alarm_5_thu).state, id(alarm_5_fri).state,
              id(alarm_5_sat).state}}
          };

          for (int i = 0; i < 5; i++) {
            auto &a = alarms[i];
            if (!a.enabled) continue;

            // Check day of week (cur_dow is 1-based: 1=Sun)
            if (!a.days[cur_dow - 1]) continue;

            // Check hour:minute match
            if (a.hour != now.hour || a.minute != now.minute) continue;

            // Prevent re-trigger within the same minute
            if (id(last_trigger_keys)[i] == current_key) continue;

            // TRIGGER!
            id(last_trigger_keys)[i] = current_key;
            id(alarm_ringing) = true;
            id(active_alarm_index) = a.index;
            id(ring_started_ts) = now.timestamp;
            id(start_alarm_sound).execute();
            return;  // only one alarm at a time
          }